name: Build Plugin

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Build Plugins
        run: ./gradlew make
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push builds
        uses: cpina/github-action-push-to-another-branch@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
        with:
          source-dir: 'builds/'
          destination-github-repo: '${{ github.repository }}'
          destination-branch: 'builds'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          user_email: "action@github.com"
          user_name: "GitHub Action"
          commit_message: "Build plugins"
